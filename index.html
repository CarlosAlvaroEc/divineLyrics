<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DivineLyrics</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main
      id="overlay-root"
      class="overlay-container is-unlocked"
      data-locked="false"
      data-mode="classic"
      data-tauri-drag-region
    >
      <button
        id="lock-pill-btn"
        type="button"
        class="lock-pill"
        aria-label="Alternar bloqueo del overlay"
        title="Bloquear / Desbloquear overlay"
      >
        <svg
          class="lock-icon icon-locked"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <svg
          class="lock-icon icon-unlocked"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 9.9-1" />
        </svg>
      </button>

      <div class="drag-handle" data-tauri-drag-region>
        <div class="mode-switcher" role="group" aria-label="Modo de letras">
          <button
            type="button"
            class="mode-btn mode-btn-editorial"
            data-mode-btn="editorial"
            title="Editorial (Bloque Dinámico)"
          >
            Aa
          </button>
          <button
            type="button"
            class="mode-btn mode-btn-typewriter"
            data-mode-btn="typewriter"
            title="Typewriter (Máquina de Escribir)"
          >
            AI
          </button>
          <button
            type="button"
            class="mode-btn mode-btn-classic is-selected"
            data-mode-btn="classic"
            title="Classic (Teleprompter 3 Líneas)"
          >
            Aa
          </button>
          <button
            type="button"
            class="mode-btn mode-btn-single"
            data-mode-btn="single"
            title="Single (Frase Única en Cursiva)"
          >
            A
          </button>
        </div>
      </div>

      <section
        id="lyrics-viewport"
        class="lyrics-viewport"
        tabindex="0"
        aria-label="Letras sincronizadas"
      >
        <div id="lyrics-stage" class="lyrics-stage">
          <p class="lyric-placeholder">
            Abre Spotify en tu sistema para mostrar la letra aquí.
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
